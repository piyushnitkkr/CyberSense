[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersense"
version = "0.1.0"
description = "Cybersecurity RAG Chatbot with source-cited answers"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "slowapi==0.1.9",
    "sse-starlette==2.1.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.1",
    "sqlalchemy==2.0.30",
    "aiosqlite==0.20.0",
    "qdrant-client==1.9.1",
    "fastembed==0.3.6",
    "rank-bm25==0.2.2",
    "groq>=0.9.0",
    "anthropic==0.28.0",
    "ollama==0.2.1",
    "pymupdf==1.24.5",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.2.2",
    "requests==2.32.3",
    "httpx==0.27.0",
    "tenacity==8.3.0",
    "rich==13.7.1",
    "chardet==5.2.0",
]

[project.optional-dependencies]
server = []
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.7",
    "black==24.4.2",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "types-requests==2.32.0.20240602",
    "types-pyyaml==6.0.12.20240311",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B904", "B905", "N806", "SIM105"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/cybersense --cov-report=term-missing"
