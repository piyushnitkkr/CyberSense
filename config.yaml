# CyberSense Configuration
# Override any value with environment variables or .env

# ── Embedding ─────────────────────────────────────────────────────────────────
embedding:
  model: "BAAI/bge-small-en-v1.5"
  device: "cpu"        # "cuda" if GPU available
  batch_size: 64
  dimension: 384

# ── Chunking ──────────────────────────────────────────────────────────────────
chunking:
  target_tokens: 512
  max_tokens: 800
  min_tokens: 50
  overlap_tokens: 64   # ~12% of target

# ── Retrieval ─────────────────────────────────────────────────────────────────
retrieval:
  k_dense: 30
  k_sparse: 30
  k_fused: 30          # after RRF
  top_k_final: 8       # after reranker
  relevance_threshold: 0.3
  max_chunks_per_doc: 3
  reranker_enabled: true
  reranker_model: "BAAI/bge-reranker-base"

# ── Generation ────────────────────────────────────────────────────────────────
generation:
  provider: "anthropic"          # "anthropic" | "ollama"
  model: "claude-3-5-haiku-20241022"
  temperature: 0.1
  max_tokens: 1024
  history_turns: 6
  general_knowledge_fallback: false

# ── Qdrant ────────────────────────────────────────────────────────────────────
qdrant:
  collection: "cybersense"
  prefer_grpc: false

# ── API ───────────────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  upload_max_mb: 25
  allowed_extensions: [".pdf", ".docx", ".md", ".txt", ".html"]
  rate_limit: "60/minute"

# ── Ingestion ─────────────────────────────────────────────────────────────────
ingestion:
  nvd_lookback_days: 730     # 2 years
  request_delay_seconds: 0.6 # polite crawling
  max_retries: 3
  retry_backoff_seconds: 2

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level: "INFO"
  json: true
