# Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: cybersense-api
    runtime: python
    region: singapore  # Closest free region to India
    plan: free
    buildCommand: >
      pip install --extra-index-url https://download.pytorch.org/whl/cpu
      -r requirements-server.txt &&
      pip install -e .
    startCommand: uvicorn cybersense.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/cybersense.db
      # ── Secrets: Set these in the Render dashboard ───────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
