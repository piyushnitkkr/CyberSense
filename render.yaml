# Render.com deployment configuration
# Docs: https://render.com/docs/render-yaml-spec

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: cybersense-api
    runtime: python
    region: singapore  # Closest free region to India
    plan: free
    buildCommand: >
      pip install -r requirements-server.txt &&
      pip install --no-deps -e . &&
      python -c "import os; from fastembed import TextEmbedding; TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir=os.environ.get('FASTEMBED_CACHE_PATH', '/opt/render/project/src/.fastembed_cache'))"
    startCommand: uvicorn cybersense.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/cybersense.db
      - key: FASTEMBED_CACHE_PATH
        value: /opt/render/project/src/.fastembed_cache
      # ── Secrets: Set these in the Render dashboard ───────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
    healthCheckPath: /health
    autoDeploy: true
