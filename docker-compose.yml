version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: cybersense-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: cybersense-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - sqlite_data:/app/db
    depends_on:
      qdrant:
        condition: service_healthy
    command: uvicorn cybersense.api.main:app --host 0.0.0.0 --port 8000

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    container_name: cybersense-ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run cybersense/ui/app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  qdrant_storage:
  sqlite_data:
